<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Week 5 Assignment: Data Sanctuary</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; background: #f4f4f9; display: flex; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        button { background: #007bff; color: white; border: none; padding: 0.75rem 1.2rem; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; margin-bottom: 1.5rem; }
        button:hover { background: #0056b3; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        .data-panel { background: #e9ecef; padding: 1rem; border-radius: 4px; }
        .data-panel h3 { margin-top: 0; font-size: 1rem; color: #495057; border-bottom: 2px solid #ced4da; padding-bottom: 0.25rem; }
        
        pre { background: #212529; color: #f8f9fa; padding: 0.5rem; border-radius: 4px; font-size: 0.8rem; overflow-x: auto; white-space: pre-wrap; }
        ul { list-style: none; padding: 0; margin: 0; }
        ul li { padding: 0.4rem 0.5rem; margin-bottom: 0.25rem; background: white; border-radius: 4px; border-left: 4px solid #28a745; font-size: 0.9rem; font-weight: 500; }
    </style>
</head>
<body>

    <div class="card">
        <h2>E-Commerce Inventory Sanctuary</h2>
        <p>Click the clean button to process our chaotic database array and extract only usable store products.</p>
        
        <button id="cleanBtn">Run Data Purge & Render</button>
        
        <div class="data-grid">
            <div class="data-panel">
                <h3>Raw Dirty Array</h3>
                <!-- The original messy array will show here -->
                <pre id="rawDisplay"></pre>
            </div>
            
            <div class="data-panel">
                <h3>Sanitized Inventory</h3>
                <!-- Output container for your dynamic loop structure -->
                <ul id="cleanListDisplay"></ul>
            </div>
        </div>
    </div>

    <script>
      // A classic simulation of broken database outputs:
// Includes empty strings, incorrect types (numbers), undefined values, and placeholder values
const dirtyInventory = [
    "Wireless Mouse",
    "",
    "Mechanical Keyboard",
    404, 
    "Ultrawide Monitor",
    "   ", 
    undefined,
    "USB-C Charging Cable",
    "UNKNOWN_PRODUCT",
    "Ergonomic Office Chair"
];

// Display raw inventory on screen immediately
document.getElementById("rawDisplay").textContent = JSON.stringify(dirtyInventory, null, 2);

function cleanData(array) {
    return array.filter(function(item) {
        return (
            typeof item === "string" &&
            item.trim() !== "" &&
            item !== "UNKNOWN_PRODUCT"
        );
    });
}

document.getElementById("cleanBtn").addEventListener("click", function() {
    
    const cleanItems = cleanData(dirtyInventory);

    const cleanList = document.getElementById("cleanListDisplay");

    cleanList.innerHTML = "";

    cleanItems.forEach(function(product) {
        const listItem = document.createElement("li");
        listItem.textContent = product;
        cleanList.appendChild(listItem);
    });

});
    </script>
</body>
</html>
